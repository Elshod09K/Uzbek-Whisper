{% extends "base.html" %}
{% block title %}Kirish — Uzbek STT{% endblock %}
{% block body %}
<div class="card" style="max-width:360px;margin:60px auto">
  <h1>Kirish / Log in</h1>
  {% if error %}<p style="color:var(--bad)">Login yoki parol noto'g'ri.</p>{% endif %}
  <form method="post" action="/login">
    <p><input name="username" placeholder="Login" autocomplete="username" required style="width:100%"></p>
    <p><input name="password" type="password" placeholder="Parol" autocomplete="current-password" required style="width:100%"></p>
    <button class="primary" style="width:100%">Kirish</button>
  </form>
</div>
{% endblock %}
